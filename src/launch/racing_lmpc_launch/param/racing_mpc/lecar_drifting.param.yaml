      q_follow: 1.0
      q_vel: 1.0
      q_vy: 1.0
      q_vyaw: 0.01
      r: [
        1e-5, 0.0,
        0.0, 0.1,
      ]
      r_d: [
        1e-5, 0.0,
        0.0, 0.01,
      ]
      max_vel_ref_diff: 0.1 # max difference between reference velocity and actual velocity

      x_max: [.inf, .inf, .inf, 6.0, 2.0, 4.0]
      x_min: [-.inf, -.inf, -.inf, 0.5, -2.0, -4.0]
      u_max: [15.0, 0.38]
      u_min: [-15.0, -0.38]
      du_max: [150.0, 2.5]
      du_min: [-150.0, -2.5]

      step_mode: "continuous"

      # LMPC 
      learning: false
      convex_hull_slack: [20.0, 20.0, 2.0, 20.0, 20.0, 2.0]
      num_ss_pts: 96
      num_ss_pts_per_lap: 32
      max_lap_stored: 3

      # recording
      record: false
