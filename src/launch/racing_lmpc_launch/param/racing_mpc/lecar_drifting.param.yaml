/**:
  ros__parameters:
    racing_mpc:
      max_cpu_time: 0.085
      max_iter: 200
      tol: 1e-3
      interface: conic
      n: 40
      dt: 0.02
      margin: -0.5
      average_track_width: 1.0
      verbose: false
      jit: true
      num_mpc: 1
      num_cycle_to_switch: 10
      max_extrapolate_horizon: 30

      q_contour: 1.0
      q_heading: 1.0
